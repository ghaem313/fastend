name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Latest MAUI Workloads
      run: dotnet workload install maui

    - name: Create Base Project
      run: dotnet new maui -n SecureTransferMobile

    - name: Inject Ghaem Graph UI & Logic
      run: |
        Copy-Item -Path "MainPage.xaml" -Destination "SecureTransferMobile/MainPage.xaml" -Force
        Copy-Item -Path "MainPage.xaml.cs" -Destination "SecureTransferMobile/MainPage.xaml.cs" -Force

    - name: Auto-Detect Version & Build APK
      run: |
        $csproj = Get-Content SecureTransferMobile/SecureTransferMobile.csproj -Raw
        $target = [regex]::Match($csproj, 'net\d+\.\d+-android').Value
        Write-Host "Target framework detected: $target"
        dotnet restore SecureTransferMobile/SecureTransferMobile.csproj
        
        # در اینجا دستورات فشرده‌سازی و حذف کدهای اضافه (Trim) اعمال شده است
        dotnet publish SecureTransferMobile/SecureTransferMobile.csproj -f $target -c Release -r android-arm64 -p:PublishTrimmed=true -p:AndroidPackageFormat=apk

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: GhaemGraph-Android-App-Lite
        path: SecureTransferMobile/bin/Release/**/*-Signed.apk
